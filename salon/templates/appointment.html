{% extends 'base.html' %}

{% block title %}
Book Appointment - AURA Unisex Salon & Academy
{% endblock %}


{% block content %}


<div style="max-width:450px; margin:auto; background:#222; padding:35px; border-radius:20px;">


<h1 style="text-align:center; color:#d4af37;">
Book Your Appointment
</h1>


{% if messages %}

{% for message in messages %}

<p style="color:#d4af37; text-align:center;">
{{ message }}
</p>

{% endfor %}

{% endif %}



<form method="POST">

{% csrf_token %}


<input type="text"
name="name"
placeholder="Your Name"
required
style="width:100%; padding:12px; margin:10px 0;">



<input type="text"
name="phone"
placeholder="Phone Number"
required
style="width:100%; padding:12px; margin:10px 0;">

<input type="email"
name="email"
placeholder="Email Address"
required
style="width:100%; padding:12px; margin:10px 0;">



<select name="service"
style="width:100%; padding:12px; margin:10px 0;">

<option>Hair Styling</option>
<option>Bridal Makeup</option>
<option>Skin Care</option>
<option>Hair Spa</option>
<option>Beauty Course</option>

</select>



<input type="date"
name="date"
id="appointment-date"
required
style="width:100%; padding:12px; margin:10px 0;">

<input type="time"
name="time"
min="10:00"
max="22:00"
required
style="width:100%; padding:12px; margin:10px 0;">

<textarea
name="message"
placeholder="Any special requests? (Optional)"
rows="4"
style="width:100%; padding:12px; margin:10px 0;"></textarea>



<button type="submit"
style="width:100%;
padding:15px;
background:#d4af37;
border:none;
border-radius:30px;
font-weight:bold;
font-size:18px;">
Book Now
</button>


</form>


</div>

<script>
const today = new Date().toISOString().split('T')[0];
document.getElementById('appointment-date').setAttribute('min', today);
</script>


{% endblock %}
