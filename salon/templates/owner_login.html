<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>Owner Login | AURA Salon</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 35px rgba(212,175,55,0.25);
        }

        .login-box h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #f8df77;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>AURA</h1>

        <p>Owner Dashboard Login</p>

        {% if form.errors %}
            <div class="error-message">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
